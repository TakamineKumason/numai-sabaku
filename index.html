function absorbSpin(el, startAng, dur){
  const nowMs=function(){ return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now(); };
  const t0=nowMs(), APPEAR=190, PREHOLD=220, R0=44, TURNS=2.3, DRIFT=0.28;
  function frame(){
    if(!el || !el.parentNode) return;
    const t=nowMs()-t0;
    if(t<APPEAR){
      el.style.opacity=(t/APPEAR).toFixed(2);
      el.style.transform='translate('+(Math.cos(startAng)*R0).toFixed(1)+'px,'+(Math.sin(startAng)*R0).toFixed(1)+'px) scale(1) rotate(0deg)';
      requestAnimationFrame(frame); return;
    }
    if(t<APPEAR+PREHOLD){
      const p=(t-APPEAR)/PREHOLD;
      const rad2=R0*(1+0.10*Math.sin(p*Math.PI));
      const ang2=startAng + DRIFT*p;
      const sc2=1+0.04*Math.sin(p*Math.PI);
      el.style.opacity='1';
      el.style.transform='translate('+(Math.cos(ang2)*rad2).toFixed(1)+'px,'+(Math.sin(ang2)*rad2).toFixed(1)+'px) scale('+sc2.toFixed(3)+') rotate(0deg)';
      requestAnimationFrame(frame); return;
    }
    let u=(t-APPEAR-PREHOLD)/dur; if(u>1)u=1;
    const eR=u*u*u;
    const eA=u*u;
    const rad=R0*(1-eR);
    const ang=startAng + DRIFT + TURNS*2*Math.PI*eA;
    const sc=Math.max(0.05, 1-0.93*(u*u));
    const op=u<0.82?1:Math.max(0,1-(u-0.82)/0.18);
    el.style.opacity=op.toFixed(2);
    el.style.transform='translate('+(Math.cos(ang)*rad).toFixed(1)+'px,'+(Math.sin(ang)*rad).toFixed(1)+'px) scale('+sc.toFixed(3)+') rotate(0deg)';
    if(u<1) requestAnimationFrame(frame);
    else if(el.parentNode) el.parentNode.removeChild(el);
  }
  requestAnimationFrame(frame);
}

function spawnResultChips(before, success, wasFever, skip){

  if(skip){ arr.push({icon:null, name:T('c_final'), effect:Math.round((g._lastRate||0)*100)+'%', c:'#ffffff', emoji:'🎯'}); }
  if(wasFever){ arr.push({icon:null, name:T('c_fever'), effect:'', c:'#ff3b6b', emoji:'🌟'}); }
  const durNow=Math.round(g.dur), durBefore=Math.round(before.dur);
  const revElian=g.elianUsed && !before.elian;
  if(success){
    arr.push({icon:null, name:T('c_reached', stageLabel()), effect:'', c:'#8dff9a', emoji:'✨'});
    arr.push({icon:null, name:T('c_finalex'), effect:'+'+(g._lastEx||0).toLocaleString(), c:'#ffd24a', emoji:'🔥'});
    if(!g._lastRolled && (g._lastSpGain||0)>0) arr.push({icon:null, name:'SP', effect:'+'+g._lastSpGain, c:'#c9b8ff', emoji:'🔹'});
    const kh = skR('kakera')>0 ? Math.round(nodeVal('kakera')) : 0;
    if(kh>0) arr.push({icon:'kakera', name:skName(TREE_MAP.kakera), effect:T('c_dur_plus',kh), c:'#8dff9a', durFx:true});
    if(skR('kyuketsu')>0 && (durNow-durBefore-kh)>=2) arr.push({icon:'kyuketsu', name:skName(TREE_MAP.kyuketsu), effect:T('c_dur_plus',3), c:'#8dff9a', durFx:true});
    if(g.cycle!==before.cycle) arr.push({icon:null, name:T('c_cycle_in',g.cycle), effect:T('c_cycle_eff',CYCLE_DIFF), c:'#ffd24a', emoji:'🎊'});
  } else {
    if(revElian) arr.push({icon:'shokunin', name:skName(TREE_MAP.shokunin), effect:T('c_elian_eff'), c:'#7fdfff', durFx:true});
    if(!revElian){ const dmg=durBefore-durNow; if(dmg>0) arr.push({icon:null, name:T('c_dur'), effect:'-'+dmg, c:'#ff6a6a', emoji:'💥', neg:true}); }
    if(skR('toranan')>0) arr.push({icon:'toranan', name:skName(TREE_MAP.toranan), effect:T('c_toranan_eff',Math.round(nodeVal('toranan')*100)), c:'#9ff3e8', durFx:true, durGuard:true});
    if(g.cycle===before.cycle && g.stage<before.stage) arr.push({icon:null, name:T('c_stage'), effect:'-'+(before.stage-g.stage), c:'#ff9c6b', emoji:'⬇', neg:true});
    if((g._lastStackGain||0)>0) arr.push({icon:'stack', name:T('c_stack'), effect:'+'+g._lastStackGain, c:'#c9b8ff'});
    if(g._lastProt) arr.push({icon:'kuronishi', name:skName(TREE_MAP.kuronishi), effect:T('c_cron_eff', g._lastProt===2), c:'#7fdfff'});
  }
  const guards = success ? [] :
    ['kuronishi','wabi','jhan'].filter(function(id){ return g._lastProt && skR(id)>0; });
  const heals = arr.filter(function(it){ return it.durFx; });
  const late=[];
  guards.forEach(function(id){ late.push(function(){ playGuard('lvguard', [id]); }); });
  heals.forEach(function(it, i){ late.push(function(){ spawnDurChips([it], i); }); });
  clearLateFx();
  if(late.length) scheduleLateFx(late);
  arr.filter(function(it){ return !it.durFx; })
     .forEach(function(it){ queueChip(it); });
}

    e.textContent='';
    lb=document.createElement('span'); lb.className='lb';

function setExGauge(exVal, wall, opt){
  const over = wall>0 && exVal>=wall;
  const r = wall>0 ? Math.max(0, Math.min(1, exVal/wall)) : 0;
  const bump = !!(opt && opt.bump);
  const num=Math.round(exVal||0).toLocaleString();
  ['exnum','pexnum'].forEach(function(id){ gaugeLabel(document.getElementById(id), T('g_ex'), num); });
  [['exbar','exbarf'],['pexbar','pexbarf']].forEach(function(p){
    const box=document.getElementById(p[0]), f=document.getElementById(p[1]);
    if(f) f.style.width=(r*100).toFixed(2)+'%';
    if(box) box.classList.toggle('exover', over);
    if(!f) return;
    if(over && bump){
      f.classList.remove('exhit'); void f.offsetWidth; f.classList.add('exhit');

}

function heatTheme(ri){
  if(ri<0 || ri<=2) return null;
  if(ri>=8){ return { edge:'#ff2f4f', bar:'#e4002b', bg:'#3c0512', win:'#2a0510', winborder:'#ff3a56' }; }
  const t=(ri-3)/4;
  const L=(a,b)=>Math.round(a+(b-a)*t);
  const col='rgb('+L(255,255)+','+L(186,64)+','+L(80,36)+')';
  const win='rgb('+L(40,42)+','+L(24,12)+','+L(4,14)+')';
  return { edge:col, bar:col, bg:'rgb('+L(34,64)+','+L(16,10)+','+L(6,8)+')', win:win, winborder:col };
}
function updateTheme(){ if(typeof document==='undefined'||!document.body) return;
  const home=(g.phase==='intro'||g.phase==='gameover'||g.ended);
  const ri= home ? -1 : (g.stage-1)%10;
  const h=heatTheme(ri);
  const doc=document.documentElement, bar=document.getElementById('heatbar');
  const setP=(k,v)=>{ if(doc&&doc.style){ if(v==null) doc.style.removeProperty(k); else doc.style.setProperty(k,v); } };
  if(!h){ setP('--edge','#6b7bd6'); setP('--winbg',null); setP('--winborder',null); document.body.style.background='';
    if(bar){ bar.style.background='transparent'; bar.style.boxShadow='none'; } }
  else { setP('--edge', h.edge); setP('--winbg', h.win); setP('--winborder', h.winborder);
    document.body.style.background='radial-gradient(ellipse at 50% 16%, '+h.bg+' 0%, #0a0206 55%, #000 100%)';
    if(bar){ bar.style.background='linear-gradient(90deg, rgba(0,0,0,0), '+h.bar+', rgba(0,0,0,0))'; bar.style.boxShadow='0 0 12px '+h.bar; } }
}

    return; }

const RUN_KEY='kyoka_run_v1';
const RUN_NUMS=['stage','cycle','maxCycle','sp','dur','stack','turn','score','maxStage',
                'succCount','failCount','feverCount','fallbackCount'];
const RUN_BOOLS=['lastFailed','elianUsed','craftPending'];
function saveRun(){
  try{
    if(!g || g.ended || g.phase==='intro' || g._animating) return;
    const o={ver:GAME_VER, skills:{}};
    RUN_NUMS.forEach(function(k){ o[k]=g[k]; });
    RUN_BOOLS.forEach(function(k){ o[k]=!!g[k]; });
    o.silentMult=(typeof g.silentMult==='number' && isFinite(g.silentMult)) ? g.silentMult : 1;
    o.skillTaken=g.skillTaken||0; o.spSpent=g.spSpent||0;
    TREE.forEach(function(n){ if(g.skills && g.skills[n.id]>0) o.skills[n.id]=g.skills[n.id]; });
    lsSet(RUN_KEY, JSON.stringify(o));
  }catch(e){}
}
function clearRun(){ try{ if(typeof localStorage!=='undefined') localStorage.removeItem(RUN_KEY); }catch(e){} }
function loadRun(){
  try{
    const s=lsGet(RUN_KEY); if(!s) return null;
    const o=JSON.parse(s); if(!o || typeof o!=='object') { clearRun(); return null; }
    const num=function(v){ return typeof v==='number' && isFinite(v) && Math.floor(v)===v && v>=0; };
    for(let i=0;i<RUN_NUMS.length;i++){ if(!num(o[RUN_NUMS[i]])) { clearRun(); return null; } }
    if(o.stage<1 || o.stage>100) { clearRun(); return null; }
    if(o.cycle<1 || o.maxCycle<o.cycle) { clearRun(); return null; }
    if(o.dur<1 || o.dur>DUR_START) { clearRun(); return null; }
    if(o.maxStage<1) { clearRun(); return null; }
    if(o.silentMult===undefined || o.silentMult===null) o.silentMult=1;
    if(typeof o.silentMult!=='number' || !isFinite(o.silentMult) || o.silentMult<1){ clearRun(); return null; }
    o.skillTaken=num(o.skillTaken)?o.skillTaken:0;
    o.spSpent   =num(o.spSpent)   ?o.spSpent   :0;
    const sk={}; TREE.forEach(function(n){
      const r=(o.skills && o.skills[n.id])||0;
      sk[n.id]=(num(r) ? Math.min(r, n.maxRank) : 0);
    });
    o.skills=sk;
    return o;
  }catch(e){ clearRun(); return null; }
}
function resumeRun(){
  const o=loadRun(); if(!o){ showIntro(); return; }
  g=newGameState();
  RUN_NUMS.forEach(function(k){ g[k]=o[k]; });
  RUN_BOOLS.forEach(function(k){ g[k]=!!o[k]; });
  g.silentMult=o.silentMult;
  g.skillTaken=o.skillTaken; g.spSpent=o.spSpent;
  TREE.forEach(function(n){ g.skills[n.id]=o.skills[n.id]||0; });
  const house=lsGet('kyoka_house')||defHouse();
  setMsg(T('msg_resume', house, o.cycle, phaseShort(o.stage), o.dur));
  enterTurn();
}

function skBindWin(){

  const pts=new Map(); let moved=0, lastD=0, lastC=null;
  const loc=function(e){ const r=win.getBoundingClientRect(); const k=r.width/(parseFloat(win.style.width)||800);

function uiGauge(r, cls){
  const rr=Math.max(0,Math.min(1,r||0));
  const bf=uiEl('upbarf'); if(bf) bf.style.width=(rr*100).toFixed(2)+'%';
  const PCTCOL={resist:'#ffbcbc', relief:'#c8fff7', fpush:'#ffc2d4', win:'#c9ffd2', lose:'#ffbcbc',
                world:'#d7bcff', lastpush:'#c9ffd2'};
  const col=PCTCOL[cls]||'#fff', val=pct1(rr);

    gaugeLabel(e, T('g_rate'), val); e.style.color=col; });
  const gg=uiEl('ugauge'); if(!gg) return;

  gg.style.webkitMaskImage=m; gg.style.maskImage=m; }
function uiDur(r){ const f=uiEl('udurf'); if(!f) return;

  const X=function(v){ return ((v-b[0])*s)+'px'; }, Y=function(v){ return ((v-b[1])*s)+'px'; };
  const tip=U_DUR.left+r*(U_DUR.right-U_DUR.left);
  const back=Math.max(tip-U_DUR.head, U_DUR.left-12), L=U_DUR.left-12;

    +X(back)+' '+Y(U_DUR.bottom)+','+X(L)+' '+Y(U_DUR.bottom)+')'; }

  if(g.ended) return 'over';
